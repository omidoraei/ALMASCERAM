<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f4f2ed" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>صفحه یافت نشد | ALMASCERAM</title>
    <meta name="description" content="صفحه‌ای که جستجو کردید وجود ندارد. به صفحه اصلی ALMASCERAM بازگردید." />
    <meta property="og:title" content="صفحه یافت نشد | ALMASCERAM" />
    <meta property="og:description" content="صفحه‌ای که جستجو کردید وجود ندارد." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALMASCERAM" />
    <meta property="og:locale" content="fa_IR" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 24px;
        background: #f4f2ed;
        color: #1a1d22;
        font-family: 'Vazirmatn', 'IRANSans', Tahoma, Arial, sans-serif;
        line-height: 1.8;
      }
      .container { max-width: 640px; text-align: center; }
      .eyebrow { font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: #8a6a2f; margin: 0 0 16px; font-weight: 600; }
      h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.3; margin: 0 0 20px; font-weight: 700; }
      p.body { font-size: 17px; color: #4a4a4a; margin: 0 0 32px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 0 0 32px; }
      .actions a {
        display: inline-flex; align-items: center; padding: 12px 24px; border-radius: 999px;
        font-size: 15px; font-weight: 600; text-decoration: none;
      }
      .primary { background: #1a1d22; color: #f4f2ed; }
      .secondary { background: transparent; color: #1a1d22; border: 1px solid #d2cec6; }
      .help { font-size: 14px; color: #6a6a6a; margin: 0; }
      .help a { color: #8a6a2f; text-decoration: none; border-bottom: 1px solid currentColor; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #f4f2ed; }
        p.body { color: #a8a8a8; }
        .primary { background: #c89b4a; color: #0f1115; }
        .secondary { color: #f4f2ed; border-color: #2a2e35; }
      }
      @media (max-width: 480px) {
        .actions { flex-direction: column; align-items: stretch; }
        .actions a { justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div class="container" role="main">
      <p class="eyebrow">خطای ۴۰۴</p>
      <h1>صفحه‌ای که دنبال آن می‌گردید پیدا نشد</h1>
      <p class="body">ممکن است صفحه منتقل شده، حذف شده یا آدرس آن اشتباه وارد شده باشد.</p>
      <nav class="actions" aria-label="ناوبری">
        <a class="primary" href="/">بازگشت به صفحه اصلی</a>
        <a class="secondary" href="/#catalog">مشاهده محصولات</a>
        <a class="secondary" href="/#about">درباره ALMASCERAM</a>
      </nav>
      <p class="help">اگر فکر می‌کنید این یک خطاست، با ما از طریق <a href="mailto:project@almasceram.ir">project@almasceram.ir</a> تماس بگیرید.</p>
    </div>
  </body>
</html>
