<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ALMASCERAM - کاتالوگ تخصصی کاشی و سرامیک پرسلانی">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1a1d22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4b96a"/>
      <stop offset="1" stop-color="#a8803a"/>
    </linearGradient>
    <pattern id="tiles" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#1a1d22"/>
      <path d="M0 0 L80 0 L80 80 L0 80 Z" fill="none" stroke="#2a2e35" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="#2a2e35"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="600" y="0" width="600" height="630" fill="url(#tiles)" opacity="0.6"/>

  <g transform="translate(80, 180)">
    <path d="M60 0 L120 30 L120 90 L60 120 L0 90 L0 30 Z" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60 18 L102 36 L102 78 L60 96 L18 78 L18 36 Z" fill="url(#gold)" opacity="0.2"/>
    <text x="60" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="url(#gold)" text-anchor="middle">M</text>
  </g>

  <text x="80" y="400" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-size="72" font-weight="700" fill="#f4f2ed" direction="rtl">الماس سرام</text>
  <text x="80" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" fill="url(#gold)">ALMASCERAM</text>
  <text x="80" y="520" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-size="28" fill="#a8a8a8" direction="rtl">کاتالوگ تخصصی کاشی و سرامیک پرسلانی</text>

  <rect x="80" y="560" width="180" height="2" fill="url(#gold)"/>
  <text x="80" y="595" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-size="22" fill="#7a7a7a" direction="rtl">almasceram.ir</text>
</svg>
