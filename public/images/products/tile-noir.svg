<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="سرامیک نوآر - رنگ مشکی">
  <defs>
    <radialGradient id="noir-bg" cx="0.3" cy="0.2" r="1.2">
      <stop offset="0" stop-color="#4a4845"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <pattern id="noir-tile" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#noir-bg)"/>
      <circle cx="20" cy="30" r="1.5" fill="#1a1a1a" opacity="0.8"/>
      <circle cx="75" cy="20" r="1" fill="#5a5a5a" opacity="0.5"/>
      <circle cx="40" cy="70" r="1.2" fill="#3a3a3a" opacity="0.6"/>
      <circle cx="85" cy="80" r="1.5" fill="#1a1a1a" opacity="0.7"/>
      <path d="M0 0 L100 0 L100 100 L0 100 Z" fill="none" stroke="#1a1a1a" stroke-width="0.3"/>
