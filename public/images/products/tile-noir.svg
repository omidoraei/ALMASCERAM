  <text x="120" y="60" font-family="Georgia, serif" font-size="9" fill="#8a6a2f" text-anchor="middle" letter-spacing="0.25em">NOIR STONE</text>
  <text x="400" y="580" font-family="Georgia, serif" font-size="10" fill="#a8a8a8" text-anchor="middle" letter-spacing="0.3em">80×80 · 60×60 · 100×100</text>
