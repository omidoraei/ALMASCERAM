  <rect width="800" height="600" fill="url(#arena-tile)"/>
  <rect x="20" y="20" width="200" height="50" fill="#1a1d22" opacity="0.85" rx="4"/>
  <text x="120" y="42" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-size="18" fill="#f4f2ed" text-anchor="middle" direction="rtl">آرنا سند</text>
  <text x="120" y="60" font-family="Georgia, serif" font-size="9" fill="#c89b4a" text-anchor="middle" letter-spacing="0.25em">ARENA SAND</text>
  <text x="400" y="580" font-family="Georgia, serif" font-size="10" fill="#3a3429" text-anchor="middle" letter-spacing="0.3em">120×240 · 80×80 · 60×60</text>
