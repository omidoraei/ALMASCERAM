<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="سرامیک آرنا سند - رنگ شنی گرم">
  <defs>
    <radialGradient id="arena-bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#e8dcc4"/>
      <stop offset="1" stop-color="#a89478"/>
    </radialGradient>
    <pattern id="arena-tile" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#arena-bg)"/>
      <circle cx="20" cy="20" r="2" fill="#8a7a5e" opacity="0.4"/>
      <circle cx="80" cy="40" r="1.5" fill="#8a7a5e" opacity="0.3"/>
      <circle cx="50" cy="90" r="2" fill="#8a7a5e" opacity="0.5"/>
