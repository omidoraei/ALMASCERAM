<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="سرامیک کلکته - رنگ مرمر سفید رگه‌دار">
  <defs>
    <linearGradient id="cal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="1" stop-color="#d4cfc1"/>
    </linearGradient>
    <pattern id="cal-vein" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#cal-bg)"/>
      <path d="M0 30 Q 50 25 100 35 T 200 40" fill="none" stroke="#8a8474" stroke-width="0.6" opacity="0.5"/>
      <path d="M0 80 Q 60 70 110 85 T 200 95" fill="none" stroke="#6a6454" stroke-width="0.8" opacity="0.4"/>
      <path d="M20 130 Q 70 125 130 140 T 200 145" fill="none" stroke="#8a8474" stroke-width="0.5" opacity="0.5"/>
      <path d="M0 180 Q 50 175 110 185 T 200 190" fill="none" stroke="#5a5444" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#cal-vein)"/>
  <rect x="20" y="20" width="200" height="50" fill="#1a1d22" opacity="0.85" rx="4"/>
  <text x="120" y="42" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-size="18" fill="#f4f2ed" text-anchor="middle" direction="rtl">کلکته اورو</text>
  <text x="120" y="60" font-family="Georgia, serif" font-size="9" fill="#c89b4a" text-anchor="middle" letter-spacing="0.25em">CALACATTA ORO</text>
  <text x="400" y="580" font-family="Georgia, serif" font-size="10" fill="#3a3429" text-anchor="middle" letter-spacing="0.3em">120×240 · 80×80</text>
</svg>
