<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="فضای معماری مدرن پوشیده‌شده با پرسلان روشن">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4cdc0"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8bfae"/>
      <stop offset="1" stop-color="#a8a08f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c89b4a"/>
      <stop offset="1" stop-color="#8a6a2f"/>
    </linearGradient>
    <pattern id="tiles" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#e8e3d8"/>
      <path d="M0 0 L60 0 L60 60 L0 60 Z" fill="none" stroke="#b8b0a0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect x="100" y="200" width="280" height="500" fill="url(#tiles)" stroke="#8a7f6a" stroke-width="1"/>
  <rect x="500" y="150" width="280" height="550" fill="url(#tiles)" stroke="#8a7f6a" stroke-width="1"/>
  <rect x="900" y="250" width="200" height="450" fill="url(#tiles)" stroke="#8a7f6a" stroke-width="1"/>
  <rect x="0" y="600" width="1200" height="200" fill="url(#floor)"/>
  <g transform="translate(580, 90)">
    <rect x="-60" y="-20" width="120" height="4" fill="url(#gold)"/>
    <text x="0" y="20" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#3a3429" text-anchor="middle" letter-spacing="0.15em">ALMASCERAM</text>
  </g>
  <text x="600" y="780" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7a6f5e" text-anchor="middle" letter-spacing="0.3em">PLACEHOLDER · HERO ARCHITECTURE</text>
</svg>
